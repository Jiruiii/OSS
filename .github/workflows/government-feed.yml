name: Publish signed government feed
on:
  schedule:
    # 372 scheduled uploads in a 31-day month; keep room for manual releases.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      diagnostics:
        description: Read-only government source network diagnostics (no publication)
        type: boolean
        default: false
      diagnostic_source:
        description: Restrict read-only diagnostics to emic, tdx, or all
        type: string
        default: all
      initial:
        description: First deployment only (no existing signed publisher state)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: government-feed-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOVERNMENT_FEED_URL: ${{ vars.GOVERNMENT_FEED_URL }}
      CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PIPELINE_SIGNING_PRIVATE_KEY: ${{ github.workspace }}/.stage2-keys/government-feed/private-key.pem
      NCDR_ALERT_API_KEY: ${{ secrets.NCDR_ALERT_API_KEY }}
      NCDR_AUTH_MODE: query
      CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
      TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
      TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
      SHELTER_STATUS_RELAY_ENDPOINT: ${{ vars.SHELTER_STATUS_RELAY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pipeline
            schemas
            data/boundaries/geojson
            android/app/src/main/assets/trust
            fixtures
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare private signing key
        if: ${{ inputs.diagnostics != true }}
        env:
          SIGNING_PEM: ${{ secrets.GOVERNMENT_SIGNING_PRIVATE_KEY }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; if(!process.env.SIGNING_PEM) throw Error('Missing signing secret'); fs.mkdirSync('.stage2-keys/government-feed',{recursive:true}); fs.writeFileSync(process.env.PIPELINE_SIGNING_PRIVATE_KEY,process.env.SIGNING_PEM,{mode:0o600});"
      - name: Restore signed release and collect government data
        if: ${{ inputs.diagnostics != true }}
        env:
          INITIAL: ${{ inputs.initial }}
        run: |
          if [ "$INITIAL" = "true" ]; then
            unset GOVERNMENT_FEED_URL
            node pipeline/government-publisher.mjs --initial
          else
            node pipeline/government-publisher.mjs
          fi
      - name: Deploy verified public files only
        if: ${{ inputs.diagnostics != true }}
        env:
          INITIAL: ${{ inputs.initial }}
        run: |
          if [ "$INITIAL" = "true" ]; then
            node pipeline/deploy-government.mjs --initial
          else
            node pipeline/deploy-government.mjs
          fi
      - name: Diagnose sources without publishing
        if: ${{ inputs.diagnostics == true }}
        env:
          DIAGNOSTIC_SOURCE: ${{ inputs.diagnostic_source }}
        run: node pipeline/tools/diagnose-government-sources.mjs
